name: EUserv Daily Renew

on:
  push:
    paths:
      - '.github/trigger-euser-renew'
  schedule:
    # 每日轻量检查；脚本仅在 EUserv 面板给出的日期到达时执行登录/续期。
    # 不依赖运行时修改 workflow，因此不需要 GH_WORKFLOW_TOKEN 的 Workflows 权限。
    - cron: '5 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: euserv-renew-main
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Check whether renewal is due
        id: renewal_gate
        shell: bash
        run: |
          TODAY="$(date -u +%F)"
          NEXT_DATE=""
          if [ -s next_renewal_date.txt ]; then
            NEXT_DATE="$(tr -d '[:space:]' < next_renewal_date.txt)"
          fi

          # 首次运行或状态文件无效时执行一次，避免因状态损坏而永久跳过。
          if ! [[ "$NEXT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -u -d "$NEXT_DATE" >/dev/null 2>&1; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "No valid saved renewal date; running a safety check."
          elif [ "$GITHUB_EVENT_NAME" != "schedule" ] || [[ "$TODAY" > "$NEXT_DATE" || "$TODAY" == "$NEXT_DATE" ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Renewal check is due: today=$TODAY next=$NEXT_DATE event=$GITHUB_EVENT_NAME"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Not due yet: today=$TODAY next=$NEXT_DATE; skipping login and renewal."
          fi

      - name: Install dependencies
        if: steps.renewal_gate.outputs.due == 'true'
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check renewal script
        if: steps.renewal_gate.outputs.due == 'true'
        id: syntax_check
        run: python -m py_compile euser_renew.py notion_sync.py

      - name: Run EUserv renew script
        if: steps.renewal_gate.outputs.due == 'true'
        id: run_renewal
        env:
          # Primary account
          EUSERV_EMAIL: ${{ secrets.EUSERV_EMAIL }}
          EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
          EUSERV_TOTP_SECRET: ${{ secrets.EUSERV_TOTP_SECRET }}
          EMAIL_PIN: ${{ secrets.EMAIL_PIN }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

          # Optional additional accounts
          EUSERV_EMAIL2: ${{ secrets.EUSERV_EMAIL2 }}
          EUSERV_PASSWORD2: ${{ secrets.EUSERV_PASSWORD2 }}
          EMAIL_PIN2: ${{ secrets.EMAIL_PIN2 }}
          EMAIL_PASS2: ${{ secrets.EMAIL_PASS2 }}

          EUSERV_EMAIL3: ${{ secrets.EUSERV_EMAIL3 }}
          EUSERV_PASSWORD3: ${{ secrets.EUSERV_PASSWORD3 }}
          EMAIL_PIN3: ${{ secrets.EMAIL_PIN3 }}
          EMAIL_PASS3: ${{ secrets.EMAIL_PASS3 }}

          EUSERV_EMAIL4: ${{ secrets.EUSERV_EMAIL4 }}
          EUSERV_PASSWORD4: ${{ secrets.EUSERV_PASSWORD4 }}
          EMAIL_PIN4: ${{ secrets.EMAIL_PIN4 }}
          EMAIL_PASS4: ${{ secrets.EMAIL_PASS4 }}

          EUSERV_EMAIL5: ${{ secrets.EUSERV_EMAIL5 }}
          EUSERV_PASSWORD5: ${{ secrets.EUSERV_PASSWORD5 }}
          EMAIL_PIN5: ${{ secrets.EMAIL_PIN5 }}
          EMAIL_PASS5: ${{ secrets.EMAIL_PASS5 }}

          # Safety policy
          # 固定白名单：仅允许已确认的 FREE 合同 442244 自动续期。
          AUTO_RENEW_CONTRACTS: '442244'
          PAID_REMINDER_INTERVAL_DAYS: ${{ vars.PAID_REMINDER_INTERVAL_DAYS || '7' }}
          MAX_LOGIN_RETRIES: '2'

          # Notifications
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}

        run: |
          python euser_renew.py

      - name: Set retry date when a due run cannot complete
        if: always()
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          TOMORROW="$(date -u -d 'tomorrow' +%F)"

          if [ "${{ steps.renewal_gate.outputs.due }}" = "true" ] && { [ "${{ steps.install.outcome }}" != "success" ] || [ "${{ steps.syntax_check.outcome }}" != "success" ] || [ "${{ steps.run_renewal.outcome }}" != "success" ]; }; then
            printf '%s\n' "$TOMORROW" > next_renewal_date.txt
            echo "Due run did not complete; retry scheduled for $TOMORROW."
          elif [ ! -s next_renewal_date.txt ]; then
            printf '%s\n' "$TOMORROW" > next_renewal_date.txt
            echo "No renewal date was produced; retry scheduled for $TOMORROW."
          fi

          NEXT_DATE="$(tr -d '[:space:]' < next_renewal_date.txt)"
          if ! [[ "$NEXT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! date -u -d "$NEXT_DATE" >/dev/null 2>&1; then
            printf '%s\n' "$TOMORROW" > next_renewal_date.txt
            echo "Invalid renewal date; retry scheduled for $TOMORROW."
          fi

      - name: Sync pending Notion reminder
        if: always()
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: python notion_sync.py

      - name: Persist reminder state
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          date -u > last_run.txt
          git add last_run.txt next_renewal_date.txt
          if [ -f notification_state.json ]; then
            git add notification_state.json
          fi
          git add -A -- notion_sync_pending.json || true

          git commit -m "Persist EUserv run state: $(cat next_renewal_date.txt)" || echo "No state changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main
