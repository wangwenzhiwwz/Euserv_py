name: EUserv Daily Renew

on:
  schedule:
    # 单次定时；运行后根据 EUserv 面板日期自动更新。失败时次日重试。
    - cron: '5 0 21 11 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: euserv-renew-main
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EUserv renew script
        env:
          # Primary account
          EUSERV_EMAIL: ${{ secrets.EUSERV_EMAIL }}
          EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
          EUSERV_TOTP_SECRET: ${{ secrets.EUSERV_TOTP_SECRET }}
          EMAIL_PIN: ${{ secrets.EMAIL_PIN }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}

          # Optional additional accounts
          EUSERV_EMAIL2: ${{ secrets.EUSERV_EMAIL2 }}
          EUSERV_PASSWORD2: ${{ secrets.EUSERV_PASSWORD2 }}
          EMAIL_PIN2: ${{ secrets.EMAIL_PIN2 }}
          EMAIL_PASS2: ${{ secrets.EMAIL_PASS2 }}

          EUSERV_EMAIL3: ${{ secrets.EUSERV_EMAIL3 }}
          EUSERV_PASSWORD3: ${{ secrets.EUSERV_PASSWORD3 }}
          EMAIL_PIN3: ${{ secrets.EMAIL_PIN3 }}
          EMAIL_PASS3: ${{ secrets.EMAIL_PASS3 }}

          EUSERV_EMAIL4: ${{ secrets.EUSERV_EMAIL4 }}
          EUSERV_PASSWORD4: ${{ secrets.EUSERV_PASSWORD4 }}
          EMAIL_PIN4: ${{ secrets.EMAIL_PIN4 }}
          EMAIL_PASS4: ${{ secrets.EMAIL_PASS4 }}

          EUSERV_EMAIL5: ${{ secrets.EUSERV_EMAIL5 }}
          EUSERV_PASSWORD5: ${{ secrets.EUSERV_PASSWORD5 }}
          EMAIL_PIN5: ${{ secrets.EMAIL_PIN5 }}
          EMAIL_PASS5: ${{ secrets.EMAIL_PASS5 }}

          # Safety policy
          AUTO_RENEW_CONTRACTS: ${{ secrets.AUTO_RENEW_CONTRACTS }}
          PAID_REMINDER_INTERVAL_DAYS: ${{ vars.PAID_REMINDER_INTERVAL_DAYS || '7' }}
          MAX_LOGIN_RETRIES: '2'

          # Notifications
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BARK_URL: ${{ secrets.BARK_URL }}

        run: |
          rm -f next_renewal_date.txt
          python euser_renew.py

      - name: Update one-time schedule from EUserv date
        if: always()
        run: |
          set -euo pipefail
          TODAY="$(date -u +%F)"
          if [ -s next_renewal_date.txt ]; then
            NEXT_DATE="$(tr -d '[:space:]' < next_renewal_date.txt)"
          else
            NEXT_DATE="$(date -u -d 'tomorrow' +%F)"
          fi

          if ! python -c 'from datetime import date; import sys; date.fromisoformat(sys.argv[1])' "$NEXT_DATE" >/dev/null 2>&1; then
            NEXT_DATE="$(date -u -d 'tomorrow' +%F)"
          fi

          # 若目标日已到或已过，次日重试，避免 cron 落回每年同一天。
          if [[ "$NEXT_DATE" == "$TODAY" || "$NEXT_DATE" < "$TODAY" ]]; then
            NEXT_DATE="$(date -u -d 'tomorrow' +%F)"
          fi

          printf '%s\n' "$NEXT_DATE" > next_renewal_date.txt
          MONTH="$(date -u -d "$NEXT_DATE" +%-m)"
          DAY="$(date -u -d "$NEXT_DATE" +%-d)"
          export NEXT_DATE
          export CRON="5 0 ${DAY} ${MONTH} *"

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(".github/workflows/daily.yml")
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r"(?m)^(\s*-\s*cron:\s*)'[^']+'\s*$",
              lambda match: f"{match.group(1)}'{os.environ['CRON']}'",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("无法唯一定位 workflow cron 行，停止提交")
          path.write_text(updated, encoding="utf-8")
          print(f"Next EUserv scheduled run: {os.environ['NEXT_DATE']} (UTC 00:05)")
          PY

      - name: Persist reminder state and keep workflow active
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          date -u > last_run.txt
          git add last_run.txt next_renewal_date.txt .github/workflows/daily.yml

          if [ -f notification_state.json ]; then
            git add notification_state.json
          fi

          git commit -m "Schedule next EUserv run: $(cat next_renewal_date.txt)" || echo "No state changes to commit"
          git pull --rebase origin main
          git push
